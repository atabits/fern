name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: script/linux-deps

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build binaries
        run: cargo build --workspace --bins --locked

      - name: Test
        run: cargo test --workspace --locked

  wasm-check:
    name: WASM shared crates check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-check

      - name: Check shared crates for wasm32
        run: >-
          cargo check --target wasm32-unknown-unknown --locked
          -p fern_core -p assets -p calendar_ui -p countdown_ui
          -p desktop_common -p desktop_sync -p fern_i18n -p focus_ui
          -p habit_ui -p horizons_ui -p icons -p life_clock_ui
          -p matrix_ui -p sticky_ui -p summary_ui -p task_ui
          -p theme -p things_ui -p todo_ui -p ui
