<!-- Fern's own glyph (AGPL-3.0-or-later): a filled calendar page with its days cut out. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <mask id="m">
    <rect width="24" height="24" fill="white"/>
    <rect x="2" y="7.6" width="20" height="1.4" fill="black"/>
    <g fill="black"><circle cx="8" cy="12.5" r="1.25"/><circle cx="12" cy="12.5" r="1.25"/><circle cx="16" cy="12.5" r="1.25"/><circle cx="8" cy="16.5" r="1.25"/><circle cx="12" cy="16.5" r="1.25"/></g>
  </mask>
  <rect x="3" y="4" width="18" height="17" rx="3.5" fill="black" mask="url(#m)"/>
  <rect x="7" y="2" width="2" height="4" rx="1" fill="black"/>
  <rect x="15" y="2" width="2" height="4" rx="1" fill="black"/>
</svg>
