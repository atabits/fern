[workspace]
resolver = "3"
members = [
    "crates/assets",
    "crates/core",
    "crates/icons",
    "crates/theme",
    "crates/ui",
    "apps/desktop",
    "apps/server",
]

[workspace.package]
edition = "2024"
version = "0.1.1"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
assets = { path = "crates/assets" }
fern_core = { path = "crates/core" }
icons = { path = "crates/icons" }
theme = { path = "crates/theme" }
ui = { path = "crates/ui" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
futures = "0.3"
notify-rust = "4"
rust-embed = { version = "8", features = ["include-exclude"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
strum = { version = "0.27", features = ["derive"] }
tiny_http = "0.12"
ureq = "3"
unicode-segmentation = "1"
sys-locale = "0.3"
uuid = { version = "1", features = ["v7"] }

gpui = { git = "https://github.com/zed-industries/zed", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", default-features = false, features = ["font-kit", "wayland", "x11"] }

# Patches copied from the Zed workspace; without them GPUI from git resolves incompatible versions.
[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[profile.dev]
# Optimize dependencies (GPUI) even in debug builds, otherwise the UI is noticeably slow.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
