name: Bug report
description: Something in Fern does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Fern did instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
  - type: input
    id: version
    attributes:
      label: Fern version
      description: Settings → About
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Wayland)
        - Linux (X11)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: System version
      placeholder: "Windows 11 24H2, macOS 15.5, Ubuntu 24.04 …"
  - type: markdown
    attributes:
      value: Please leave out personal task contents; describe them instead.
