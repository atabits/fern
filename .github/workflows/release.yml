name: Release

# Run manually to build packages. With "release" enabled on main, attach them to
# a draft release for the version in Cargo.toml. Publishing the draft creates its tag.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Make a draft release of Cargo.toml's version (main only)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RELEASE: ${{ inputs.release && github.ref == 'refs/heads/main' }}

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the binaries run on older glibc too.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    # Signing turns on once its credentials are set in the repository (see docs/code-signing.md);
    # without them the packages are built unsigned, as before.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          script/linux-deps
          sudo apt-get install -y --no-install-recommends rpm desktop-file-utils appstream
          desktop-file-validate assets/linux/fern-tasks.desktop
          appstreamcli validate --no-net --explain assets/linux/io.github.atabits.fern.metainfo.xml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Version
        id: version
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1 | tr -d '\r')
          if [ "$RELEASE" = true ]; then
            echo "version=$crate_version" >> "$GITHUB_OUTPUT"
          else
            echo "version=$crate_version-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p fern_desktop -p fern_server

      # Windows: SignPath signs the programs with an Authenticode certificate.
      - name: Upload the programs for signing
        id: unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/fern.exe
            target/${{ matrix.target }}/release/fern-server.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: fern
          signing-policy-slug: ${{ env.RELEASE == 'true' && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: windows-programs
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/${{ matrix.target }}/release

      # macOS: a Developer ID certificate for the signature, then Apple's notarization.
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Package
        env:
          FERN_PREBUILT: 1
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: script/package ${{ matrix.target }} ${{ steps.version.outputs.version }}

      # The installer is made from the signed programs, and then signed itself.
      - name: Upload the installer for signing
        id: unsigned-installer
        if: steps.unsigned.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-${{ matrix.target }}
          path: dist/*-setup.exe
          if-no-files-found: error

      - name: Sign the installer with SignPath
        if: steps.unsigned-installer.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: fern
          signing-policy-slug: ${{ env.RELEASE == 'true' && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist

      - uses: actions/upload-artifact@v4
        with:
          name: fern-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    # The same as RELEASE above: a job's `if` cannot read `env`.
    if: inputs.release && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: fern-*
          merge-multiple: true

      # What is new in this version (.github/changes/<version>.md), then the page for every release.
      - name: Release notes
        id: notes
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1 | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "v$version" > /dev/null; then
            echo "::error::v$version is already released; raise the version in Cargo.toml"
            exit 1
          fi
          if [ -f ".github/changes/$version.md" ]; then
            { cat ".github/changes/$version.md"; echo; } > notes.md
          fi
          sed "s/{version}/$version/g; s|{repo}|$GITHUB_REPOSITORY|g" .github/release-notes.md >> notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Fern v${{ steps.notes.outputs.version }}
          tag_name: v${{ steps.notes.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: dist/*
          # Published by hand once the packages are checked.
          draft: true

  publish-aur:
    name: Update AUR (optional)
    if: inputs.release && github.ref == 'refs/heads/main' && secrets.AUR_SSH_PRIVATE_KEY != ''
    needs: [package, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: fern-*-unknown-linux-gnu
          merge-multiple: true

      - name: Update AUR PKGBUILD and .SRCINFO
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1 | tr -d '\r')
          sha_x86=$(sha256sum "dist/fern-${version}-linux-x86_64.tar.gz" | awk '{print $1}')
          sha_arm=$(sha256sum "dist/fern-${version}-linux-arm64.tar.gz" | awk '{print $1}')
          bash script/update-aur "$version" "$sha_x86" "$sha_arm"

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_ed25519
          chmod 600 ~/.ssh/aur_ed25519
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_ed25519 -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/fern-tasks-bin.git /tmp/aur-repo
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO /tmp/aur-repo/
          cd /tmp/aur-repo
          git config user.name "atabits-bot"
          git config user.email "endlessspring.of@gmail.com"
          if ! git diff --quiet; then
            git commit -am "Update to v$(sed -n 's/^pkgver=//p' PKGBUILD)"
            git push origin master
          fi
