[workspace]
resolver = "3"
members = [
    "crates/assets",
    "crates/calendar_ui",
    "crates/core",
    "crates/countdown_ui",
    "crates/desktop_common",
    "crates/desktop_sync",
    "crates/focus_ui",
    "crates/habit_ui",
    "crates/horizons_ui",
    "crates/i18n",
    "crates/icons",
    "crates/life_clock_ui",
    "crates/matrix_ui",
    "crates/plugin_ui",
    "crates/plugins",
    "crates/settings_ui",
    "crates/sticky_ui",
    "crates/summary_ui",
    "crates/task_ui",
    "crates/theme",
    "crates/things_ui",
    "crates/todo_ui",
    "crates/ui",
    "apps/desktop",
    "apps/server",
]

[workspace.package]
edition = "2024"
version = "0.3.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/atabits/fern"
homepage = "https://fern.atabits.com"

[workspace.lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
let_underscore_future = "deny"
redundant_clone = "deny"
todo = "deny"

[workspace.dependencies]
assets = { path = "crates/assets" }
calendar_ui = { path = "crates/calendar_ui" }
countdown_ui = { path = "crates/countdown_ui" }
desktop_common = { path = "crates/desktop_common" }
desktop_sync = { path = "crates/desktop_sync" }
fern_core = { path = "crates/core" }
fern_i18n = { path = "crates/i18n" }
fern_server = { path = "apps/server" }
focus_ui = { path = "crates/focus_ui" }
habit_ui = { path = "crates/habit_ui" }
horizons_ui = { path = "crates/horizons_ui" }
icons = { path = "crates/icons" }
life_clock_ui = { path = "crates/life_clock_ui" }
matrix_ui = { path = "crates/matrix_ui" }
plugin_ui = { path = "crates/plugin_ui" }
plugins = { path = "crates/plugins" }
settings_ui = { path = "crates/settings_ui" }
sticky_ui = { path = "crates/sticky_ui" }
summary_ui = { path = "crates/summary_ui" }
task_ui = { path = "crates/task_ui" }
theme = { path = "crates/theme" }
things_ui = { path = "crates/things_ui" }
todo_ui = { path = "crates/todo_ui" }
ui = { path = "crates/ui" }

anyhow = "1"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "std"] }
async-io = "2"
base64 = "0.22"
block2 = "0.6"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
chrono-tz = "0.10.4"
dirs = "6"
dispatch2 = "0.3"
futures = "0.3"
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
hmac = "0.12"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
notify-rust = "4"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSScreen",
    "NSSound",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSBundle",
    "NSData",
    "NSError",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSSet",
    "NSString",
    "NSURL",
    "objc2-core-foundation",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
    "block2",
    "std",
] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac", "sha2"] }
raw-window-handle = "0.6"
resvg = "0.46"
roxmltree = "0.21"
rquickjs = { version = "0.14.0", features = ["loader", "futures", "classes", "macro", "chrono"] }
rust-embed = { version = "8", features = ["include-exclude"] }
rusqlite = { version = "0.43", features = ["bundled", "backup", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallvec = "1"
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
strum = { version = "0.27", features = ["derive"] }
subtle = "2"
tempfile = "3"
tiny_http = "0.12"
ureq = "3"
unicode-segmentation = "1"
usvg = { version = "0.46", default-features = false }
sys-locale = "0.3"
uuid = { version = "1", features = ["v7", "serde", "js"] }
walkdir = "2"
wasm-bindgen = "0.2"
web-time = "1"
winresource = "0.1"
x11rb = { version = "0.13", features = ["randr"] }
zeroize = "1"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

gpui = { git = "https://github.com/zed-industries/zed", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", default-features = false, features = ["font-kit", "wayland", "x11"] }

# Patches copied from the Zed workspace; without them GPUI from git resolves incompatible versions.
[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

# Mirror external dependency settings for build scripts & proc-macros to avoid compiling shared crates twice.
[profile.dev.build-override]
split-debuginfo = "unpacked"
codegen-units = 16
debug = 0

# Strip debug symbols from external dependencies (gpui, windows, etc.) to drastically shrink PDBs & link time.
[profile.dev.package."*"]
debug = 0

[profile.dev.package]
# Compile proc-macros and their parsers with -O3 once so macro expansion is fast on every edit.
syn = { opt-level = 3 }
quote = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
gpui_macros = { opt-level = 3 }
derive_refineable = { opt-level = 3 }
strum_macros = { opt-level = 3 }
serde_derive = { opt-level = 3 }
rust-embed-impl = { opt-level = 3 }
thiserror-impl = { opt-level = 3 }
futures-macro = { opt-level = 3 }
async-trait = { opt-level = 3 }
windows-implement = { opt-level = 3 }
windows-interface = { opt-level = 3 }
zerocopy-derive = { opt-level = 3 }
bytemuck_derive = { opt-level = 3 }

# Hot runtime UI/rendering dependencies stay smooth in debug builds without optimizing all 400+ crates.
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
usvg = { opt-level = 3 }
tiny-skia = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
serde_json = { opt-level = 3 }

# Small single-file internal crates compile faster as a single codegen unit.
assets = { codegen-units = 1 }
fern_i18n = { codegen-units = 1 }
icons = { codegen-units = 1 }

# Full debug info profile when attaching a debugger: `cargo build --profile dbg`
[profile.dbg]
inherits = "dev"
debug = "full"

[profile.dbg.build-override]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.release.package]
fern_desktop = { codegen-units = 16 }

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
